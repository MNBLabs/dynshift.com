<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DynShift</title>
    <meta name="description" content="DynShift makes PhonePad, which turns an Android phone into a wireless Xbox-compatible controller for Windows." />
    <link rel="canonical" href="https://dynshift.com/" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7fc" />
    <meta name="color-scheme" content="light" />
    <meta name="google-adsense-account" content="ca-pub-1564512150436986" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DynShift" />
    <meta property="og:description" content="DynShift makes PhonePad: no controller? Use your phone." />
    <meta property="og:url" content="https://dynshift.com/" />
    <meta property="og:image" content="https://phonepad.dynshift.com/og.png" />
    <style>
      @font-face {
        font-family: "Bricolage";
        src: url("/fonts/Bricolage-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Bricolage Display";
        src: url("/fonts/BricolageDisplay-ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-display: swap;
      }
      :root {
        --paper: #f7f7fc;
        --raised: #ffffff;
        --line: #e2e1ee;
        --ink: #15142b;
        --ink2: #5a5878;
        --accent: #5a4fe6;
        --accent-deep: #4a40d4;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: "Bricolage", ui-sans-serif, system-ui, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        padding: 24px;
      }
      ::selection { background: rgba(129, 120, 255, 0.28); }
      main { max-width: 560px; width: 100%; }
      .mark { width: 40px; height: 40px; color: var(--ink); }
      h1 {
        font-family: "Bricolage Display", "Bricolage", sans-serif;
        font-weight: 800;
        font-size: clamp(2.2rem, 7vw, 3.4rem);
        line-height: 1;
        letter-spacing: -0.035em;
        margin: 28px 0 16px;
        text-wrap: balance;
      }
      p { margin: 0 0 1em; color: var(--ink2); max-width: 46ch; }
      .product {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 36px;
        padding: 18px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
        color: var(--ink);
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .product:active { transform: scale(0.97); }
      .product img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
      .product strong {
        display: block;
        font-family: "Bricolage Display", "Bricolage", sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        letter-spacing: -0.02em;
      }
      .product span { color: var(--ink2); font-size: 0.95rem; }
      .product .go { margin-left: auto; color: var(--accent); font-weight: 600; white-space: nowrap; }
      footer { margin-top: 40px; font-size: 0.9rem; color: var(--ink2); }
      footer a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
      :focus-visible { outline: 2px solid #8178ff; outline-offset: 3px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>

        <path d="M69.096 79.2898L69.0967 102.226C69.0967 107.394 67.175 112.112 63.9992 115.709C60.8238 112.112 58.9031 107.394 58.903 102.226V79.2905L69.096 79.2898ZM102.226 58.9032C107.394 58.9032 112.111 60.8246 115.708 64C112.111 67.1754 107.394 69.0968 102.226 69.0968L79.2897 69.0961V58.9039L102.226 58.9032ZM69.096 58.9039V69.0961L58.903 69.0968V58.9032L69.096 58.9039ZM12.2899 64C15.8871 60.8242 20.6055 58.9032 25.774 58.9032H48.7094V69.0968H25.774C20.6055 69.0968 15.8871 67.1758 12.2899 64ZM63.9992 12.2907C67.175 15.888 69.0967 20.6056 69.0967 25.7741L69.096 48.7102L58.903 48.7095V25.7741C58.9031 20.606 60.8238 15.8878 63.9992 12.2907Z"/>
      </svg>
      <h1>DynShift makes software you can hold.</h1>
      <p>One product so far. It is free and open source.</p>

      <a class="product" href="https://phonepad.dynshift.com/">
        <img src="/brand/phonepad-512.png" alt="" width="56" height="56" />
        <div>
          <strong>PhonePad</strong>
          <span>No controller? Use your phone.</span>
        </div>
        <span class="go">Open →</span>
      </a>

      <footer>
        <a href="https://github.com/MNBLabs" rel="noopener">GitHub</a>
      </footer>
    </main>
  </body>
</html>
